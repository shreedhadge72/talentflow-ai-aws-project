AWSTemplateFormatVersion: '2010-09-09'
Description: TalentFlow AI demo - public EC2 application using Docker

Parameters:
  ProjectName:
    Type: String
    Default: talentflow-ai
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]*$'
    Description: Short project name

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
    Description: EC2 instance type

  GitHubRepoUrl:
    Type: String
    Default: https://github.com/shreedhadge72/talentflow-ai-aws-project.git
    Description: Public GitHub repository URL containing the Dockerfile

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI ID

Resources:
  TalentFlowVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  TalentFlowInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref TalentFlowVPC
      InternetGatewayId: !Ref TalentFlowInternetGateway

  TalentFlowPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TalentFlowVPC
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-subnet'

  TalentFlowRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TalentFlowVPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  TalentFlowDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref TalentFlowRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref TalentFlowInternetGateway

  TalentFlowSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TalentFlowPublicSubnet
      RouteTableId: !Ref TalentFlowRouteTable

  TalentFlowSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP access to the demo website
      VpcId: !Ref TalentFlowVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-web-sg'

  TalentFlowEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ec2-role'

  TalentFlowInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref TalentFlowEC2Role

  TalentFlowEC2Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - TalentFlowSubnetRouteAssociation
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref TalentFlowInstanceProfile
      SubnetId: !Ref TalentFlowPublicSubnet
      SecurityGroupIds:
        - !Ref TalentFlowSecurityGroup
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/talentflow-bootstrap.log | logger -t user-data -s 2>/dev/console) 2>&1

          dnf update -y
          dnf install -y docker git
          systemctl enable --now docker

          git clone --depth 1 --branch main ${GitHubRepoUrl} /opt/talentflow
          cd /opt/talentflow

          docker build -t talentflow-ai .
          docker run -d \
            --restart unless-stopped \
            --name talentflow-ai \
            -p 80:5000 \
            talentflow-ai

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-web-server'

Outputs:
  WebsiteURL:
    Description: Public URL of the TalentFlow AI website
    Value: !Sub 'http://${TalentFlowEC2Instance.PublicIp}'

  InstanceId:
    Description: EC2 instance ID
    Value: !Ref TalentFlowEC2Instance

  PublicIP:
    Description: Public IPv4 address of the EC2 instance
    Value: !GetAtt TalentFlowEC2Instance.PublicIp

  VPCId:
    Description: VPC ID
    Value: !Ref TalentFlowVPC